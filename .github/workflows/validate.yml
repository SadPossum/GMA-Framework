name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check solution sync
        shell: pwsh
        run: ./eng/sync-solution.ps1 -RepositoryRoot . -Solution Gma.Framework.slnx -Check

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Bootstrap source roots
        shell: pwsh
        run: ./eng/bootstrap-source-roots.ps1 -Force

      - name: Restore
        run: dotnet restore Gma.Framework.slnx

      - name: Build
        run: dotnet build Gma.Framework.slnx --no-restore -m:1

      - name: Test
        shell: pwsh
        run: ./eng/test-fast.ps1 -NoBuild

  providers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Bootstrap source roots
        shell: pwsh
        run: ./eng/bootstrap-source-roots.ps1 -Force

      - name: Restore
        run: dotnet restore Gma.Framework.slnx

      - name: Build
        run: dotnet build Gma.Framework.slnx --no-restore -m:1

      - name: Run provider integration tests
        shell: pwsh
        run: ./eng/test-docker.ps1 -NoBuild
